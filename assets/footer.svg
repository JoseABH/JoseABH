    .b16 { animation: barPulse 12s ease-in-out infinite; animation-delay: -10.66s; }
    .b17 { animation: barPulse 12s ease-in-out infinite; animation-delay: -6.08s; }
    .b18 { animation: barPulse 12s ease-in-out infinite; animation-delay: -1.50s; }
    .b19 { animation: barPulse 12s ease-in-out infinite; animation-delay: -8.91s; }
    .b20 { animation: barPulse 12s ease-in-out infinite; animation-delay: -4.33s; }
    .b21 { animation: barPulse 12s ease-in-out infinite; animation-delay: -11.74s; }
    .b22 { animation: barPulse 12s ease-in-out infinite; animation-delay: -7.16s; }
    .b23 { animation: barPulse 12s ease-in-out infinite; animation-delay: -2.58s; }
    .b24 { animation: barPulse 12s ease-in-out infinite; animation-delay: -9.99s; }
    .b25 { animation: barPulse 12s ease-in-out infinite; animation-delay: -5.41s; }
    .b26 { animation: barPulse 12s ease-in-out infinite; animation-delay: -0.83s; }
    .b27 { animation: barPulse 12s ease-in-out infinite; animation-delay: -8.24s; }
    .b28 { animation: barPulse 12s ease-in-out infinite; animation-delay: -3.66s; }
    .b29 { animation: barPulse 12s ease-in-out infinite; animation-delay: -11.08s; }
    .b30 { animation: barPulse 12s ease-in-out infinite; animation-delay: -6.49s; }
    .b31 { animation: barPulse 12s ease-in-out infinite; animation-delay: -1.91s; }

    @keyframes barPulse {
      0%, 100% { transform: scaleY(0.4); transform-box: fill-box; transform-origin: bottom; }
      50% { transform: scaleY(1.4); transform-box: fill-box; transform-origin: bottom; }
    }
    @keyframes streamFlash {
      0%, 100% { stroke-opacity: 0.5; }
      50% { stroke-opacity: 0.9; }
    }
    @keyframes statusPulse {
      0%, 70%, 100% { opacity: 1; transform: scale(1); }
      80% { opacity: 0.4; transform: scale(0.7); }
    }
    @keyframes scanDrift {
      from { transform: translateY(0); }
      to { transform: translateY(8px); }
    }
  </style>
  <defs>
    <linearGradient id="neon-foot-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2954ff" stop-opacity="0.08"/>
      <stop offset="50%" stop-color="#000000"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <pattern id="scan-foot" x="0" y="0" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#ffffff" fill-opacity="0.025"/>
    </pattern>
  </defs>

  <rect width="100%" height="100%" fill="url(#neon-foot-bg)" rx="14" ry="14"/>

  <!-- Top hairline divider, glowing -->
  <line class="stream-line" x1="40" y1="6" x2="760" y2="6" stroke="#2954ff" stroke-width="1" stroke-opacity="0.6" filter="drop-shadow(0 0 4px #2954ff)"/>

  <!-- Header strip: status pill on left, frame counter on right -->
  <g class="header-pill" transform="translate(40 22)">
    <rect x="-8" y="-12" width="118" height="20" rx="4" fill="#000000" stroke="#20ee24" stroke-width="1" stroke-opacity="0.6"/>
    <circle class="status-dot" cx="2" cy="-2" r="2.5" fill="#20ee24" filter="drop-shadow(0 0 3px #20ee24)"/>
    <text x="12" y="2" fill="#20ee24" font-family="ui-monospace, monospace" font-size="10" letter-spacing="1.5">CONNECTED</text>
  </g>

  <!-- Big "// END_TRANSMISSION" header -->
  <text class="tx" x="400" y="65" text-anchor="middle" fill="#e6e5ff" font-family="ui-monospace, monospace" font-size="20" font-weight="700" letter-spacing="2" filter="drop-shadow(0 0 6px #2954ff)">// END_TRANSMISSION</text>

  <!-- Tagline / sign-off subline -->
  <text class="tag-line" x="400" y="93" text-anchor="middle" fill="#20ee24" font-family="ui-monospace, monospace" font-size="13" letter-spacing="1">JOSEABH / Systems Engineer / COSTA RICA</text>

  <!-- Socials row, alternating cyan/magenta -->
  


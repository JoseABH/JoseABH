    .b6 { animation: barPulse 12s ease-in-out infinite; animation-delay: -8.50s; }
    .b7 { animation: barPulse 12s ease-in-out infinite; animation-delay: -3.91s; }
    .b8 { animation: barPulse 12s ease-in-out infinite; animation-delay: -11.33s; }

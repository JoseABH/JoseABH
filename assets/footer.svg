<svg xmlns="http://www.w3.org/2000/svg" width="800" height="180" viewBox="0 0 800 180">
  <style>
    .stream-line { animation: streamFlash 12s ease-in-out infinite; }
    .status-dot { animation: statusPulse 12s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .scan { animation: scanDrift 12s linear infinite; }
    .b0 { animation: barPulse 12s ease-in-out infinite; animation-delay: -0.00s; }
    .b1 { animation: barPulse 12s ease-in-out infinite; animation-delay: -7.42s; }
    .b2 { animation: barPulse 12s ease-in-out infinite; animation-delay: -2.83s; }
    .b3 { animation: barPulse 12s ease-in-out infinite; animation-delay: -10.25s; }
    .b4 { animation: barPulse 12s ease-in-out infinite; animation-delay: -5.67s; }
